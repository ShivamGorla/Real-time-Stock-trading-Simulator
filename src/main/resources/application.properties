spring.application.name=stock-trading-simulator

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_trading_simulator}
spring.datasource.username=${DB_USERNAME:stock_app}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

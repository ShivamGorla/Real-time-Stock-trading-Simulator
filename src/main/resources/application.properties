spring.application.name=stock-trading-simulator

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_trading_simulator}
spring.datasource.username=${DB_USERNAME:stock_app}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Simulated Price Engine ---
stock.simulation.enabled=true
stock.simulation.fixed-rate=5000
stock.simulation.initial-delay=5000
stock.simulation.max-pct-change=0.015

# --- Order Settings ---
stock.order.max-quantity=100000
stock.order.auto-execute=false

# --- Email (SMTP). Leave MAIL_HOST unset to disable sending. Never commit real credentials. ---
# Environment variables: MAIL_HOST, MAIL_PORT (default 587), MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
app.mail.from=${MAIL_FROM:no-reply@stocksim.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- Email verification / password reset ---
# Login is blocked for unverified NEW accounts only when this is true. Legacy accounts are always allowed.
app.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:false}
app.auth.verify-token-hours=24
app.auth.reset-token-minutes=30
app.auth.resend-cooldown-seconds=60

# --- Simulated payments (virtual money only) ---
app.payments.min-amount=100
app.payments.max-amount=500000
# The simulated processor declines exactly this amount, so the rejection path can be demonstrated.
app.payments.simulated-reject-amount=666.66

# --- AI Trading Assistant (read-only; disabled by default, never requires API key to start) ---
stocksim.assistant.enabled=${STOCKSIM_ASSISTANT_ENABLED:false}
stocksim.assistant.api-key=${STOCKSIM_ASSISTANT_API_KEY:}
stocksim.assistant.base-url=${STOCKSIM_ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}
stocksim.assistant.model=${STOCKSIM_ASSISTANT_MODEL:openai/gpt-oss-120b}

spring.application.name=stock-trading-simulator

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_trading_simulator}
spring.datasource.username=${DB_USERNAME:stock_app}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Simulated Price Engine ---
stock.simulation.enabled=true
stock.simulation.fixed-rate=5000
stock.simulation.initial-delay=5000
stock.simulation.max-pct-change=0.015

# --- Order Settings ---
stock.order.max-quantity=100000
stock.order.auto-execute=false

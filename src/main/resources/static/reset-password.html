<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | StockSim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
<main class="auth-main" id="main">
    <div class="auth-form-wrap">
        <h1>Choose a new password</h1>
        <form id="reset-form" novalidate>
            <div class="field"><label for="new-password">New password (8 or more characters)</label>
                <input type="password" id="new-password" class="input" minlength="8" maxlength="72" autocomplete="new-password" required></div>
            <div class="field"><label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" class="input" autocomplete="new-password" required></div>
            <button type="submit" class="btn btn-primary btn-block">Update password</button>
        </form>
        <div id="result" class="alert" role="status" hidden></div>
        <p class="auth-switch"><a href="/login.html">Back to sign in</a></p>
    </div>
</main>
<script src="/js/email-pages.js"></script>
</body>
</html>

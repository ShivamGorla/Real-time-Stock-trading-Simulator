<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — StockSim</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="bg-atmosphere"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    
    <div class="container auth-container">
        <a href="/" class="logo text-center"><span class="logo-icon">◆</span> StockSim</a>
        
        <div class="glass-card auth-card">
            <h2>Create Account</h2>
            <div id="form-error" class="alert alert-error" style="display:none;"></div>
            
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="input-glass" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="input-glass" required minlength="3" maxlength="50">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="input-glass" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-glass" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" class="input-glass" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></p>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>

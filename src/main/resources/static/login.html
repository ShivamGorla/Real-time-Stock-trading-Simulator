<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — StockSim</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="bg-atmosphere"><div class="orb orb-3"></div><div class="orb orb-4"></div></div>
    
    <div class="container auth-container">
        <a href="/" class="logo text-center"><span class="logo-icon">◆</span> StockSim</a>
        
        <div class="glass-card auth-card">
            <h2>Welcome Back</h2>
            <div id="form-error" class="alert alert-error" style="display:none;"></div>
            <div id="form-success" class="alert alert-success" style="display:none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="input-glass" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-glass" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="/register.html">Create one</a></p>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>

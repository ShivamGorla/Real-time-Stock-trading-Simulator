<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | StockSim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
<main class="auth-main" id="main">
    <div class="auth-form-wrap">
        <h1>Forgot your password?</h1>
        <p>Enter your account email. If it matches an account we will send a link.</p>
        <form id="email-form" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" class="input" autocomplete="email" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-url="/api/auth/forgot-password">Send reset link</button>
            <button type="submit" class="btn btn-quiet btn-block" data-url="/api/auth/resend-verification">Resend verification email</button>
        </form>
        <div id="result" class="alert" role="status" hidden></div>
        <p class="auth-switch"><a href="/login.html">Back to sign in</a></p>
    </div>
</main>
<script src="/js/email-pages.js"></script>
</body>
</html>
